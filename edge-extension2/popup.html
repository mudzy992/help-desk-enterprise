<!doctype html>
<html lang="bs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>EP-HelpDesk</title>
    <link rel="stylesheet" href="/src/popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="brand">
          <div class="brand-mark">H</div>
          <div><strong>EP-HelpDesk</strong><span id="subtitle"></span></div>
        </div>
        <div class="header-actions">
          <button id="open-notifications" class="icon-button" type="button" aria-label="Notifications">
            <span>◌</span><b id="notification-count" hidden>0</b>
          </button>
        </div>
      </header>

      <section id="login-view" class="view">
        <div class="hero-copy">
          <span class="eyebrow" id="login-eyebrow"></span>
          <h1 id="login-title"></h1>
          <p id="login-description"></p>
        </div>
        <form id="login-form" class="card form-card">
          <label><span id="api-label"></span><input id="api-base-url" type="url" required placeholder="http://localhost:10001" /></label>
          <label><span id="email-label"></span><input id="email" type="email" required autocomplete="username" /></label>
          <label><span id="password-label"></span><input id="password" type="password" required autocomplete="current-password" /></label>
          <button id="login-button" class="primary" type="submit"></button>
        </form>
      </section>

      <section id="workspace" class="view" hidden>
        <div class="workspace-head">
          <div>
            <span class="eyebrow" id="workspace-eyebrow"></span>
            <h2 id="workspace-title"></h2>
          </div>
          <span id="connection-status" class="status-pill"></span>
        </div>

        <div id="action-banner" class="action-banner" hidden>
          <div><strong id="action-title"></strong><span id="action-description"></span></div>
          <button id="action-open" type="button"></button>
        </div>

        <div id="inbox-section">
          <div class="section-title"><span id="tickets-title"></span><span id="ticket-count"></span></div>
          <ul id="inbox" class="ticket-list"></ul>
          <div id="inbox-empty" class="empty-state" hidden></div>
        </div>

        <div id="thread" class="thread card" hidden>
          <div class="thread-head">
            <button id="back-to-inbox" class="back-button" type="button">←</button>
            <div><span id="thread-number" class="eyebrow"></span><h3 id="thread-title"></h3></div>
          </div>
          <ol id="messages" class="messages"></ol>
          <div id="quick-assist-panel" class="quick-assist" hidden>
            <div><span class="qa-icon">↗</span><div><strong id="qa-title"></strong><span id="qa-description"></span></div></div>
            <button id="open-quick-assist" class="secondary" type="button"></button>
          </div>
          <form id="reply-form" class="reply-form">
            <textarea id="reply-body" rows="3"></textarea>
            <div class="reply-footer"><span id="reply-hint"></span><button id="reply-button" class="primary" type="submit"></button></div>
          </form>
          <button id="open-desk-ticket" class="link-button" type="button"></button>
        </div>

        <div class="workspace-footer">
          <button id="open-desk" class="secondary" type="button"></button>
          <select id="language-select" aria-label="Language"><option value="auto">Automatic</option><option value="bs">Bosanski</option><option value="en">English</option></select>
          <button id="sign-out" class="link-button" type="button"></button>
        </div>
      </section>

      <p id="error" class="error" hidden></p>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
