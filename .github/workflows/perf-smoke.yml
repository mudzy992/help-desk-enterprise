name: Perf smoke

# Phase 4.2 (plan §4.2, item 1): the performance gate the program was missing.
#
# It is a *smoke*, not the full run: 200 virtual users for 5 minutes against a
# throwaway Postgres + Redis, with the CI thresholds from `perf/config.js`
# (`ciThresholds`) — every one of them carries a comment naming its source.
# A failing threshold fails the job; the k6 summary and the API log are uploaded
# as artefacts so a regression can be read without re-running the pipeline.

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: perf-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The run publishes its numbers as a PR comment: artefacts and logs are awkward to
  # reach outside a browser session, while a comment is readable from the API/CLI.
  pull-requests: write

jobs:
  perf-smoke:
    name: k6 smoke (CI thresholds)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ephelpdesk
          POSTGRES_PASSWORD: ephelpdesk
          POSTGRES_DB: ephelpdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ephelpdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ephelpdesk:ephelpdesk@127.0.0.1:5432/ephelpdesk
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_KEY_PREFIX: ephelpdesk
      QUEUE_PREFIX: bull:ephelpdesk
      PORT: "10001"
      CORS_ORIGIN: http://127.0.0.1:5173
      # The query-budget tool (plan §4.2, item 2) is OFF in production and ON here.
      DB_QUERY_METRICS: "true"
      # Measured in CI 2026-09-24 (run 36041855923, 65048 requests): 2.084 queries
      # per application request (local rig showed 1.705 — warm caches, and queries
      # inside interactive transactions are not counted), down from 18.4 -> 8.7 -> 5.0 -> 2.1 (settings snapshot,
      # display-label cache, then: shared settings snapshot, scope-catalogue cache,
      # confidential short-circuit, one raw query for SLA + CSAT, option A group
      # notifications). Per endpoint: POST message 4, list/inbox/search 3, detail 2.
      # Gate = CI measurement x 1.2 (user decision), target = 2.0.
      #
      # Note the 3.6 this gate once claimed: that was an EMPTY database. The batch
      # loaders skip their round trips when there is nothing to resolve, so an empty
      # app looks cheap. Only seeded data measures real queries.
      DB_QUERY_BUDGET: "2.1"
      DB_QUERY_TARGET: "2.0"
      DB_QUERY_BUDGET_WARN: "true"
      # Smoke profile + relaxed, documented thresholds.
      PERF_PROFILE: ci
      BASE_URL: http://127.0.0.1:10001
      REPO_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Apply migrations
        working-directory: backend
        run: npx prisma migrate deploy

      - name: Build the API
        working-directory: backend
        run: npm run build

      - name: Start the API
        working-directory: backend
        run: |
          nohup node dist/src/main.js > "$REPO_ROOT/api.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS "$BASE_URL/health" > /dev/null; then
              echo "API is up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::API did not become healthy in 60s"
          tail -50 "$REPO_ROOT/api.log"
          exit 1

      - name: Run the install wizard (super-admin -> login-provider -> seed -> complete)
        env:
          PERF_ADMIN_EMAIL: perf-admin@example.test
          PERF_ADMIN_PASSWORD: Perf-Smoke-1!
        run: |
          # The wizard is a sequence, and the CI fixture used to run only half of it:
          # without `login-provider` the setting `private.auth.mode` stays unset and every
          # `POST /auth/login` answers 503 AUTHENTICATION_UNAVAILABLE; without `complete`
          # there is no JWT signing secret. k6 then reported "2 requests, 0s wall clock".
          #
          # Every step is checked, and a failure prints the response body — a silent
          # failure here cost a day of "the smoke gate is green but empty".
          rm -f /tmp/install-wizard.log
          note() { echo "$*" | tee -a /tmp/install-wizard.log; }

          post() {
            local path="$1" payload="$2" allowed="$3" file status
            file="/tmp/install$(echo "$path" | tr '/' '-').json"
            if [ -n "$payload" ]; then
              status=$(curl -sS -o "$file" -w '%{http_code}' -X POST "$BASE_URL$path" \
                -H 'content-type: application/json' -d "$payload")
            else
              status=$(curl -sS -o "$file" -w '%{http_code}' -X POST "$BASE_URL$path")
            fi
            note "$path -> HTTP $status"
            note "  $(head -c 400 "$file" 2>/dev/null)"
            # Regex, not `case` with a variable pattern: an expanded `20*|409` is a single
            # literal pattern in bash (`|` is not alternation after expansion), so a
            # perfectly good 201 was reported as a failure.
            if ! printf '%s' "$status" | grep -qE "^($allowed)$"; then
              note "::error::$path returned HTTP $status"
              exit 1
            fi
          }

          post /install/super-admin \
            "{\"email\":\"$PERF_ADMIN_EMAIL\",\"displayName\":\"Perf Smoke\",\"password\":\"$PERF_ADMIN_PASSWORD\"}" "20[0-9]|409"
          post /install/login-provider '{"mode":"local"}' "20[0-9]"
          post /install/seed "" "20[0-9]"
          post /install/complete "" "20[0-9]"

          # Prove that the account the k6 scenarios log in with actually works: a 401 here
          # is the difference between "no load at all" and a real smoke run.
          login_status=$(curl -sS -o /tmp/login.json -w '%{http_code}' \
            -X POST "$BASE_URL/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$PERF_ADMIN_EMAIL\",\"password\":\"$PERF_ADMIN_PASSWORD\"}")
          note "login probe -> HTTP $login_status"
          if [ "$login_status" != "200" ] && [ "$login_status" != "201" ]; then
            note "  $(head -c 400 /tmp/login.json 2>/dev/null)"
            note "::error::login probe for $PERF_ADMIN_EMAIL returned HTTP $login_status"
            exit 1
          fi

      - name: Seed load-test tickets (detail, messages and the dashboard need them)
        env:
          PERF_ADMIN_EMAIL: perf-admin@example.test
          PERF_ADMIN_PASSWORD: Perf-Smoke-1!
          SEED_TICKETS: "120"
        run: |
          # The install wizard seeds the catalogue but no tickets, so until this step the
          # agent flow had nothing to open: `GET /tickets/:id`, `POST …/messages` and the
          # dashboard summary reported p95 = 0 — three budgets "passed" without measuring
          # anything. Creating 120 tickets through the public API also exercises the same
          # code path the smoke then measures.
          #
          # The two ids come from the seed the wizard just created: `/install/seed` makes
          # the organisational unit, an ACTIVE service and the routing rule (OU + service
          # -> fallback group), so a ticket created with them is `PENDING` with a group —
          # which is exactly what the group inbox lists. Created without the routing rule
          # the ticket would be `UNROUTED`, invisible in the inbox, and the detail and
          # message endpoints would still report 0,00.
          set -euo pipefail
          read_json() { python3 -c "import json,sys; d=json.load(sys.stdin); print($1)"; }
          rm -f /tmp/seed-tickets.log
          note() { echo "$*" | tee -a /tmp/seed-tickets.log; }

          token=$(curl -sS -X POST "$BASE_URL/auth/login" \
            -H 'content-type: application/json' \
            -d "{\"email\":\"$PERF_ADMIN_EMAIL\",\"password\":\"$PERF_ADMIN_PASSWORD\"}" \
            | read_json 'd.get("accessToken","")')
          if [ -z "$token" ]; then
            echo "::error::no access token — cannot seed tickets"
            exit 1
          fi
          auth="Authorization: Bearer $token"

          seed_file=/tmp/install-install-seed.json
          organizational_unit_id=""
          service_id=""
          if [ -f "$seed_file" ]; then
            organizational_unit_id=$(read_json 'd["organizationalUnit"]["id"]' < "$seed_file" || true)
            service_id=$(read_json 'd["service"]["id"]' < "$seed_file" || true)
          fi
          if [ -z "$organizational_unit_id" ] || [ -z "$service_id" ]; then
            note "seed response carried no ids; reading them from the public API instead"
            service_id=$(curl -sS -H "$auth" "$BASE_URL/services?lifecycle=ACTIVE" \
              | read_json '(d if isinstance(d, list) else d.get("items", []))[0]["id"]')
            organizational_unit_id=$(curl -sS -H "$auth" "$BASE_URL/organizational-units/tree" \
              | python3 -c "import json,sys
          def walk(nodes):
              for node in nodes or []:
                  if isinstance(node, dict) and node.get('id'):
                      return node['id']
                  if isinstance(node, dict):
                      found = walk(node.get('children'))
                      if found:
                          return found
              return ''
          print(walk(json.load(sys.stdin)))")
          fi
          if [ -z "$service_id" ] || [ -z "$organizational_unit_id" ]; then
            echo "::error::no service (or no organisational unit) to create tickets in — is the install seed in place?"
            exit 1
          fi
          note "seeding $SEED_TICKETS tickets: service $service_id, origin unit $organizational_unit_id"

          created=0
          failed=0
          for index in $(seq 1 "$SEED_TICKETS"); do
            status=$(curl -sS -o /tmp/ticket.json -w '%{http_code}' \
              -X POST "$BASE_URL/tickets" -H "$auth" -H 'content-type: application/json' \
              -d "{\"title\":\"Perf smoke ticket $index\",\"description\":\"Seeded by the perf-smoke workflow so the detail, message and dashboard endpoints are measurable. Ticket $index of $SEED_TICKETS; safe to delete.\",\"impact\":\"MEDIUM\",\"urgency\":\"MEDIUM\",\"serviceId\":\"$service_id\",\"originUnitId\":\"$organizational_unit_id\",\"acknowledgeDuplicate\":true}")
            case "$status" in
              2*) created=$((created + 1)) ;;
              *) failed=$((failed + 1)); [ "$failed" -le 3 ] && head -c 200 /tmp/ticket.json ;;
            esac
          done
          note "tickets created: $created, failed: $failed"

          if [ "$created" -eq 0 ]; then
            echo "::error::no ticket could be created — the smoke would measure an empty app"
            exit 1
          fi

          inbox=$(curl -sS -H "$auth" "$BASE_URL/tickets/inbox?pageSize=5" \
            | read_json 'len(d.get("items", []) if isinstance(d, dict) else d)')
          note "tickets visible in /tickets/inbox: $inbox"
          if [ "$inbox" -eq 0 ]; then
            # Not fatal, but it is the difference between "the agent flow measured nothing"
            # and a real number: the group inbox lists unassigned PENDING tickets with a
            # group, so an empty inbox means routing did not assign one.
            note "::warning::the group inbox is empty — \`GET /tickets/:id\` and the message endpoint will report 0,00"
          fi

      - uses: grafana/setup-k6-action@v1

      - name: Run the k6 smoke with CI thresholds
        # 200 VU / 5 min profile; the ceiling is here so a stalled run fails the job
        # instead of sitting in the queue for hours (the first honest run did exactly that).
        timeout-minutes: 20
        env:
          REPORT_LABEL: ci-smoke
          AGENT_EMAIL: perf-admin@example.test
          AGENT_PASSWORD: Perf-Smoke-1!
          REQUESTER_EMAIL: perf-admin@example.test
          REQUESTER_PASSWORD: Perf-Smoke-1!
        run: |
          # `set -o pipefail` matters: otherwise the pipeline reports `tee`'s status (0),
          # so a broken threshold or an aborted run left the job green — which is why the
          # 200 VU "gate" could not block anything.
          set -o pipefail
          k6 run perf/smoke.js 2>&1 | tee perf-smoke.log
          echo "--- threshold verdict ---"
          grep -E '(✓|✗|•)' perf-smoke.log || true

      - name: Check the query budget from the API log
        id: query-budget
        # Also runs when the k6 step failed: the log still carries the numbers, and those
        # numbers are what explains the failure.
        if: always()
        run: |
          # Custom threshold (plan §4.2): the average `db_queries_per_request` must stay at
          # or below the documented budget (DB_QUERY_BUDGET, default 2.1).
          #
          # Bootstrap traffic (`/install/*`, `/health`) is reported separately and NOT
          # counted into the average: it runs once per stack (super-admin + seed) and is not
          # part of the load profile the budget describes. Everything else counts.
          rm -f /tmp/app-queries.txt /tmp/query-budget-paths.txt
          awk '
            # Nest colorizes its log lines. Stripping the escape sequences in a rule that
            # runs before the first field access matters: awk splits the record into fields
            # lazily, so a later `gsub` leaves "/tickets\x1b[39m" beside "/tickets" and
            # halves every per-route count. The CSI remnant ("[39m") is removed first, the
            # ESC byte second.
            { gsub(/\[[0-9;]*m/, ""); gsub(/[^[:print:]]/, "") }
            /db_queries_per_request=/ {
              query = ""; path = "";
              for (i = 1; i <= NF; i++) {
                if ($i ~ /^db_queries_per_request=/) { split($i, pair, "="); query = pair[2] + 0 }
                if ($i ~ /^path=/) { split($i, pair, "="); path = pair[2] }
              }
              if (path == "") path = "?";
              total_sum += query; total_n += 1;
              # Bracket expression instead of `\/`: awk implementations disagree about
              # an escaped slash inside a regex, and the first CI runs classified the
              # bootstrap requests as application traffic because of it.
              if (path ~ /^[/](install|health)/ || path ~ /^[/]auth[/](login|logout|refresh)/) {
                bootstrap_sum += query; bootstrap_n += 1;
              } else {
                app_sum += query; app_n += 1;
                print query > "/tmp/app-queries.txt";
                path_sum[path] += query; path_n[path] += 1;
              }
            }
            END {
              printf "TOTAL_N=%d\nTOTAL_AVG=%.3f\nAPP_N=%d\nAPP_AVG=%.3f\nBOOTSTRAP_N=%d\n",
                total_n, (total_n ? total_sum / total_n : 0), app_n,
                (app_n ? app_sum / app_n : 0), bootstrap_n;
              for (p in path_sum)
                printf "%.3f %d %s\n", path_sum[p] / path_n[p], path_n[p], p > "/tmp/query-budget-paths.txt";
            }
          ' api.log | tee /tmp/query-budget.env

          . /tmp/query-budget.env
          # Gate = the measured baseline plus headroom (the plan's iron rule: a threshold
          # comes from a measurement, not from an aspiration). TARGET is the engineering
          # goal tracked in PERF_BUDGETS.md; the gap is a work item, not a hidden failure.
          BUDGET="${DB_QUERY_BUDGET:-2.1}"
          TARGET="${DB_QUERY_TARGET:-2.0}"
          P95=0
          MAX=0
          if [ -s /tmp/app-queries.txt ]; then
            P95=$(sort -n /tmp/app-queries.txt | awk '{ a[NR] = $1 } END { i = int(NR * 0.95); if (i < 1) i = 1; print a[i] }')
            MAX=$(sort -n /tmp/app-queries.txt | tail -1)
          fi
          echo "avg (sve):              ${TOTAL_AVG} preko ${TOTAL_N} zahtjeva"
          echo "avg (aplikacija):       ${APP_AVG} preko ${APP_N} zahtjeva   <- kapija ${BUDGET} (baseline + headroom), cilj ${TARGET}"
          echo "p95 / max (aplikacija): ${P95} / ${MAX}"
          echo "bootstrap (izuzeto):    ${BOOTSTRAP_N} zahtjeva (install/health/auth-login)"
          echo "najskuplje rute:"
          sort -k1,1nr /tmp/query-budget-paths.txt 2>/dev/null | head -5 | sed 's/^/  /' || true

          {
            echo "| Metrika | Vrijednost |"
            echo "|---|---|"
            echo "| avg \`db_queries_per_request\` (aplikacija) | **${APP_AVG}** preko ${APP_N} zahtjeva (kapija ${BUDGET}, cilj ${TARGET}) |"
            echo "| p95 / max (aplikacija) | ${P95} / ${MAX} |"
            echo "| avg (sve, s bootstrapom) | ${TOTAL_AVG} preko ${TOTAL_N} |"
            echo "| bootstrap (\`/install/*\`, \`/health\`, \`/auth/login|logout|refresh\` — izuzeto iz kapije) | ${BOOTSTRAP_N} |"
            echo ""
            echo "<details><summary>najskuplje rute po prosjeku upita (uključuje i izuzete rute)</summary>"
            echo ""
            echo '```'
            sort -k1,1nr /tmp/query-budget-paths.txt 2>/dev/null | head -8 || true
            echo '```'
            echo "</details>"
          } > /tmp/query-budget-report.md

          if [ "$APP_N" -gt 0 ] && awk -v avg="$APP_AVG" -v budget="$BUDGET" 'BEGIN { exit !(avg > budget) }'; then
            echo "::error::avg db_queries_per_request=${APP_AVG} (aplikacija) prelazi budžet od ${BUDGET}"
            exit 1
          fi

      - name: Upload the k6 summary and the API log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-smoke-${{ github.run_id }}
          path: |
            perf/results/ci-smoke.json
            perf/results/ci-smoke.md
            perf-smoke.log
            api.log
          retention-days: 30

      - name: Publish the numbers on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The verdict is read from the rendered report rather than the k6 console block:
          # its layout varies between k6 versions and produced a constant "0 / 0".
          # `|| true`, not `|| echo 0`: `grep -c` already prints 0 and exits 1, so the
          # fallback used to print a second line ("9 prošlo, 0\n0 palo").
          thresholds_ok=$(grep -cE '\| ok \|' perf/results/ci-smoke.md 2>/dev/null || true)
          thresholds_failed=$(grep -cE 'FAILED' perf/results/ci-smoke.md 2>/dev/null || true)
          {
            echo "### Perf smoke — run [${{ github.run_id }}](${RUN_URL})"
            echo ""
            echo "**k6 pragovi:** ${thresholds_ok} prošlo, ${thresholds_failed} palo (CI pragovi = budžet × 2,5, \`perf/config.js\`)"
            echo ""
            echo "**Budžet upita**"
            echo ""
            cat /tmp/query-budget-report.md 2>/dev/null || echo "_korak budžeta nije stigao do izvještaja — vidi log runa_"
            echo ""
            if [ -f perf/results/ci-smoke.md ]; then
              echo "<details><summary>k6 izvještaj (\`perf/results/ci-smoke.md\`)</summary>"
              echo ""
              echo '```'
              head -90 perf/results/ci-smoke.md
              echo '```'
              echo "</details>"
            fi
            echo ""
            echo "**Neuspjeli odgovori po ruti (iz api.log)**"
            echo ""
            echo '```'
            sed -e 's/\x1b\[[0-9;]*[a-zA-Z]//g' api.log 2>/dev/null \
              | grep -oE 'status=[0-9]+ method=[A-Z]+ path=[^ ]+' \
              | grep -vE 'status=2[0-9][0-9]' | sort | uniq -c | sort -rn | head -10 \
              || echo "(nijedan odgovor nije bio non-2xx)"
            echo '```'
            echo ""
            echo "<details><summary>k6 izlaz (zadnjih 30 linija perf-smoke.log)</summary>"
            echo ""
            echo '```'
            tail -30 perf-smoke.log 2>/dev/null || echo "(k6 nije ništa zapisao — run je stao prije prve iteracije)"
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>Seed tiketa — transkript</summary>"
            echo ""
            echo '```'
            cat /tmp/seed-tickets.log 2>/dev/null || echo "(korak seeda nije pisao transkript)"
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>Install wizard — transkript</summary>"
            echo ""
            echo '```'
            cat /tmp/install-wizard.log 2>/dev/null | tail -30 || echo "(korak wizarda nije pisao transkript)"
            echo '```'
            echo "</details>"
            echo ""
            echo "<details><summary>API log — login / seed / greške (zadnjih 25 linija)</summary>"
            echo ""
            echo '```'
            grep -iE 'auth/login|install/seed|install/super-admin|error| 401| 403| 500' api.log 2>/dev/null | tail -25 || echo "(nema pogodaka)"
            echo '```'
            echo "</details>"
            echo ""
            echo "_Puni profil (2.800 VU / 30 min) se mjeri na stagingu — vidi \`ops/staging-checklist.md\`._"
          } > /tmp/perf-comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/perf-comment.md
