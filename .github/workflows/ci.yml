name: CI

# Quality model (2026-10-06) — full reasoning in `docs/plans/ci-e2e-kapija.md`:
#   * pull_request -> the gate. Backend + frontend (fast) and the E2E **smoke**
#     subset (~10-15 min). All three are required status checks on `master`, and
#     every one of them is created on every PR — a docs-only PR therefore also
#     reports them, so no required check can stay "Expected" and block a merge.
#   * push to master -> backend + frontend only. Docs-only commits are skipped
#     (paths-ignore); a code push no longer drags the ~35-60 min E2E job along,
#     because the stack it would test is being rebuilt by Coolify at that moment.
#   * schedule (nightly) -> the full 71-test E2E run on a quiet stack.
#   * workflow_dispatch -> triage: `specs=10,18,22`, `retries: 0`,
#     `max_failures: 8` turn a red run into minutes instead of ~35.
on:
  push:
    branches: [main, master]
    # A commit that only touches documentation cannot change product behaviour.
    # Note: this filter is deliberately NOT on `pull_request` (see above).
    paths-ignore:
      - "docs/**"
      - ".cursor/**"
      - "**/*.md"
      - "perf/results/**"
  pull_request:
    branches: [main, master]
  schedule:
    # 01:00 UTC — a full E2E run on a stack nobody is deploying to.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      # Triage (2026-10-05): a red run of 71 specs takes ~35 min; these make the
      # first look cheaper. `max_failures` stops the run after N failures, and
      # `retries: 0` does not retry them. Defaults keep the full, strict run.
      max_failures:
        description: "E2E only: stop after this many failed tests (0 = run all)"
        required: false
        default: "0"
      retries:
        description: "E2E only: retries per failing test (0 = no retry)"
        required: false
        default: "1"
      specs:
        description: "E2E only: comma-separated spec numbers, e.g. 10,18,22 (empty = all 36 files)"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # A superseded PR run has no value, so it is cancelled. A run on `master` is
  # the record of what was pushed and is therefore never cancelled silently.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides what actually has to run. Deliberately plain `git diff` instead of a
  # third-party path-filter action, and deliberately *fail-safe*: anything it
  # cannot read counts as "code changed", so a broken diff can only cost time,
  # never skip a test.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.diff.outputs.code }}
      docs: ${{ steps.diff.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -u
          base=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/${BASE_REF}"
            git fetch --no-tags --quiet origin "${BASE_REF}" || true
          elif [ -n "${BEFORE_SHA:-}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ]; then
            base="${BEFORE_SHA}"
          fi

          files=""
          if [ -n "$base" ] && git rev-parse --verify --quiet "$base^{commit}" >/dev/null; then
            files="$(git diff --name-only "$base" HEAD || true)"
          fi

          if [ -z "$files" ]; then
            # Unknown diff (first push, force push, shallow history, merge queue):
            # run everything rather than guess.
            echo "::warning title=Change detection fell back::Could not diff against '$base' — running every job."
            code=true
            docs=true
          else
            code=false
            docs=false
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                docs/*|.cursor/*|*.md|perf/results/*) docs=true ;;
                *) code=true ;;
              esac
            done <<< "$files"
          fi

          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "Detected: code=$code docs=$docs"
          if [ -n "$files" ]; then echo "--- changed files ---"; echo "$files"; fi

  backend:
    name: Backend build + test
    runs-on: ubuntu-latest
    needs: [changes]
    # On a PR only what the change can break runs. On push/schedule/dispatch the
    # list is empty (no `changes` diff for a schedule), so everything runs.
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    timeout-minutes: 25
    env:
      # Prisma 7 resolves `env("DATABASE_URL")` while loading its config, so
      # `prisma generate` dies on a bare runner. Generation never connects, so a
      # syntactically valid placeholder is enough — no live Postgres in this job.
      DATABASE_URL: postgresql://servicedesk:servicedesk@127.0.0.1:5432/servicedesk
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --ci --coverage=false

  frontend:
    name: Frontend build + test
    runs-on: ubuntu-latest
    needs: [changes]
    if: github.event_name != 'pull_request' || needs.changes.outputs.code == 'true'
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          # Puna istorija: `updatedAt` u manifestu ogledala dolazi iz
          # `git log -1 -- <fajl>` (scripts/generate-docs-content.mjs).
          # U plitkom klonu (zadano) datum je datum vršnog commita za svaki
          # fajl, pa bi provjera sinhronizacije padala bez stvarnog razloga.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check tracked files are client-neutral (Paket 4.1 §9, 4.1a §6)
        run: node ../scripts/check-client-neutral.mjs
      - name: Test the client-neutral guard itself (Paket 4.1a §6.4)
        run: node --test ../scripts/check-client-neutral.test.mjs
      - name: Check .env.example is authoritative (Paket 4.1 §7a)
        run: node ../scripts/check-env-example.mjs
      - name: Check screens for raw identifiers or raw grouping keys
        run: node ../scripts/check-ticket-id-leaks.mjs
      - name: Test the raw-identifier guard itself
        run: node --test ../scripts/check-ticket-id-leaks.test.mjs
      - name: Check the Pulse design system (tokens, colours, radius, i18n)
        run: node ../scripts/check-pulse-design-system.mjs
      - name: Check theme contrast (WCAG AA — konstitucija §22.1 i §22.3)
        run: node ../scripts/check-theme-contrast.mjs
      - name: Check static accessibility rules (Paket 2.8 §5.2)
        run: node ../scripts/check-a11y-static.mjs
      - name: Check no hook runs after an early return (React #310)
        run: node ../scripts/check-hooks-order.mjs
      - name: Test the hooks-order guard itself
        run: node --test ../scripts/check-hooks-order.test.mjs
      - name: Check docs content and mirror sync (Faza 3, DOCS_MODULE.md §9)
        run: node ../scripts/check-docs-content.mjs
      # Faza 3 (dopuna) — provjera „Šta je novo“/ruta ima i svoj test.
      - name: Test the docs-content guard itself
        run: node --test ../scripts/check-docs-content.test.mjs
      - name: Check the ticket-list page size against the API maximum (val 1)
        run: node ../scripts/check-ticket-list-page-size.mjs
      - name: Check workflow YAML for unquoted colons
        run: node ../scripts/check-workflows-yaml.mjs
      - name: Test the workflow-YAML guard itself
        run: node --test ../scripts/check-workflows-yaml.test.mjs
      - run: npm test
      - run: npm run build

  # A documentation-only pull request never has to build the product, but it
  # still must not merge a broken mirror or a bad frontmatter — that is exactly
  # what this guard checks (Faza 3, DOCS_MODULE.md §9). 30 s, no dependencies.
  docs-guard:
    name: Docs guard
    runs-on: ubuntu-latest
    needs: [changes]
    if: needs.changes.outputs.docs == 'true' || github.event_name != 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Check docs content and mirror sync
        run: node scripts/check-docs-content.mjs
      - name: Test the docs guard itself
        run: node --test scripts/check-docs-content.test.mjs

  e2e:
    name: E2E critical flows
    runs-on: ubuntu-latest
    # Pull request -> smoke subset (the gate); schedule -> full run; dispatch ->
    # triage or full. NOT on push: the stack is being rebuilt by Coolify right
    # then, so a red run there would only describe a half-deployed environment
    # (the nightly run covers that same revision once the deploy is quiet).
    # Runs when the product itself changed (a PR) or on schedule/dispatch; never
    # on a plain push, where Coolify is rebuilding the very stack it would test.
    # `needs.*.result == 'success'` keeps a red unit job from being followed by a
    # 15-minute browser run.
    if: >-
      (github.event_name != 'pull_request' || needs.changes.outputs.code == 'true') &&
      needs.backend.result == 'success' && needs.frontend.result == 'success'
    needs: [changes, backend, frontend]
    # The full run is ~35-60 min; the ceiling only stops a hang.
    timeout-minutes: 90
    env:
      # Optional: with these four/five secrets set, the runner opens an SSH
      # tunnel to the database instead of requiring a public Postgres port.
      # See e2e/README.md ("Kada je E2E_DATABASE_URL dovoljan").
      E2E_SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
      E2E_SSH_HOST: ${{ secrets.E2E_SSH_HOST }}
      E2E_SSH_PORT: ${{ secrets.E2E_SSH_PORT }}
      E2E_SSH_USER: ${{ secrets.E2E_SSH_USER }}
      E2E_SSH_DB_PORT: ${{ secrets.E2E_SSH_DB_PORT }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - name: Typecheck E2E specs and helpers
        run: npx tsc --noEmit -p tsconfig.json
      # Fails before Playwright starts, with a readable reason. Never prints a
      # value: only "set" / "empty" per name, resolved hosts and the health code.
      - name: Preflight — variables, secrets and stack reachability
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_API_URL: ${{ vars.E2E_API_URL }}
          E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
          E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_AGENT_EMAIL: ${{ secrets.E2E_AGENT_EMAIL }}
          E2E_AGENT_PASSWORD: ${{ secrets.E2E_AGENT_PASSWORD }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || secrets.DATABASE_URL }}
          E2E_INSTALL_TOKEN: ${{ secrets.E2E_INSTALL_TOKEN }}
        run: |
          set -u
          for name in E2E_BASE_URL E2E_API_URL E2E_SUPERADMIN_EMAIL E2E_SUPERADMIN_PASSWORD \
            E2E_USER_EMAIL E2E_USER_PASSWORD E2E_AGENT_EMAIL E2E_AGENT_PASSWORD DATABASE_URL E2E_INSTALL_TOKEN; do
            if [ -n "${!name:-}" ]; then echo "$name: set"; else echo "$name: empty"; fi
          done

          if [ -z "${E2E_API_URL:-}" ]; then
            echo "::error title=E2E did not run::E2E_API_URL is empty. Use a REPOSITORY variable (Settings -> Secrets and variables -> Actions -> Variables tab). A variable created under Settings -> Environments is only visible to a job that declares that environment, and this job does not."
            exit 1
          fi

          api_host=$(node -e "process.stdout.write(new URL(process.argv[1]).hostname)" "$E2E_API_URL")
          echo "API host: $api_host -> $(getent hosts "$api_host" | head -1 || echo 'NOT RESOLVABLE from this runner')"
          if [ -n "${DATABASE_URL:-}" ]; then
            db_host=$(node -e "process.stdout.write(new URL(process.argv[1]).hostname)" "$DATABASE_URL" 2>/dev/null || echo '?')
            echo "Database host: $db_host -> $(getent hosts "$db_host" | head -1 || echo 'NOT RESOLVABLE from this runner (internal Coolify/Docker names do not work here)')"
          fi

          health_code=$(curl -sS -o /tmp/e2e-health.json -w '%{http_code}' -m 20 "$E2E_API_URL/health" || echo 000)
          echo "GET $E2E_API_URL/health -> $health_code $(head -c 200 /tmp/e2e-health.json 2>/dev/null)"
          if [ "$health_code" != "200" ]; then
            echo "::error title=E2E stack unreachable::The API did not answer /health with 200 from a GitHub runner. Check the public DNS, the reverse proxy and any IP allow-listing between the runner and $E2E_API_URL."
            exit 1
          fi
      # Optional, only when E2E_SSH_* secrets exist: no public Postgres port is
      # then needed. Point E2E_DATABASE_URL at 127.0.0.1:15432.
      - name: Open an SSH tunnel to the database (optional)
        if: ${{ env.E2E_SSH_PRIVATE_KEY != '' && env.E2E_SSH_HOST != '' }}
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$E2E_SSH_PRIVATE_KEY" > ~/.ssh/e2e-db
          chmod 600 ~/.ssh/e2e-db
          ssh -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes -f -N \
            -i ~/.ssh/e2e-db -p "${E2E_SSH_PORT:-22}" \
            -L "15432:127.0.0.1:${E2E_SSH_DB_PORT:-5432}" \
            "${E2E_SSH_USER:-root}@${E2E_SSH_HOST}"
          echo "SSH tunnel is up: 127.0.0.1:15432 -> ${E2E_SSH_HOST}:${E2E_SSH_DB_PORT:-5432}."
          if [ -n "${DATABASE_URL:-}" ]; then
            db_host=$(node -e "process.stdout.write(new URL(process.argv[1]).hostname)" "$DATABASE_URL" 2>/dev/null || echo '?')
            if [ "$db_host" != "127.0.0.1" ] && [ "$db_host" != "localhost" ]; then
              echo "::warning title=E2E tunnel unused::E2E_DATABASE_URL still points at \"$db_host\". While the tunnel is open it must point at 127.0.0.1:15432, otherwise the tunnel is bypassed and the MFA reset fails on the internal host."
            else
              echo "E2E_DATABASE_URL points at the tunnel (127.0.0.1:15432)."
            fi
          fi
      - run: npx playwright install --with-deps chromium
      - name: Run E2E (smoke on a pull request, full on schedule / dispatch)
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_API_URL: ${{ vars.E2E_API_URL }}
          E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
          E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_AGENT_EMAIL: ${{ secrets.E2E_AGENT_EMAIL }}
          E2E_AGENT_PASSWORD: ${{ secrets.E2E_AGENT_PASSWORD }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || secrets.DATABASE_URL }}
          E2E_SUPERADMIN_TOTP_SECRET: ${{ secrets.E2E_SUPERADMIN_TOTP_SECRET }}
          E2E_INSTALL_TOKEN: ${{ secrets.E2E_INSTALL_TOKEN }}
          E2E_RETRIES: ${{ inputs.retries || '1' }}
          E2E_SPECS: ${{ inputs.specs }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: |
          # Triage (2026-10-05): a full run is 71 tests / ~35 min, so a red run can
          # be narrowed to the files that failed, e.g. specs=10,18,22. Numbers map
          # to `e2e/tests/<number>-*.spec.ts`; an unknown number fails loudly
          # instead of silently running everything.
          #
          # 2026-10-06: the *gate* on a PR is the smoke subset below, not all 36
          # files — a merge should not wait ~35-60 min. The full run happens
          # nightly (`schedule`) and on demand (`workflow_dispatch`).
          smoke_specs="01,02,03,15,22"
          case "${{ github.event_name }}" in
            pull_request)
              specs="$smoke_specs"
              retries="0"
              max_failures="1"
              echo "PR gate: smoke subset ($specs), retries=0, fail fast."
              ;;
            workflow_dispatch)
              specs="${E2E_SPECS:-}"
              retries="${E2E_RETRIES:-1}"
              max_failures="${{ inputs.max_failures || '0' }}"
              echo "Dispatch: specs='${specs:-all}', retries=$retries, max_failures=$max_failures."
              ;;
            *)
              specs=""
              retries="${E2E_RETRIES:-1}"
              max_failures="0"
              echo "Scheduled full run: all files, retries=$retries."
              ;;
          esac
          # Both are read by `e2e/playwright.config.ts` through the environment;
          # the `env:` block above only seeds them from the dispatch inputs.
          E2E_SPECS="$specs"
          E2E_RETRIES="$retries"
          files=()
          if [ -n "${E2E_SPECS:-}" ]; then
            IFS=',' read -ra parts <<< "$E2E_SPECS"
            for part in "${parts[@]}"; do
              number="$(echo "$part" | tr -d '[:space:]')"
              [ -z "$number" ] && continue
              matches=(tests/"$number"-*.spec.ts)
              if [ ! -e "${matches[0]}" ]; then
                echo "::error title=Unknown spec::No tests/$number-*.spec.ts in e2e/ — check the dispatch input."
                exit 1
              fi
              files+=("${matches[@]}")
            done
            echo "Triage mode: running ${#files[@]} spec file(s): ${files[*]}"
          fi

          args=(--reporter=list,json)
          if [ "$max_failures" != "0" ] && [ -n "$max_failures" ]; then
            echo "Triage mode: stopping after $max_failures failed test(s), retries=$retries."
            args+=(--max-failures="$max_failures")
          fi
          npx playwright test "${args[@]}" "${files[@]}"
      # Always, so a red run leaves a readable trace in the log and as an artifact.
      - name: Summarize failures (JSON report)
        if: ${{ always() }}
        run: node scripts/summarize-playwright-json.mjs results.json
      - name: Upload the Playwright report and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/results.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Test the JSON summarizer itself
        if: ${{ always() }}
        run: node --test scripts/summarize-playwright-json.test.mjs

  # The single required status check. A required check that a path filter skipped
  # never reports and blocks the pull request forever, so the *check* is this job
  # and the filtering happens above it. It fails only on a real failure — a
  # skipped job is listed as such and does not fail the gate.
  gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, backend, frontend, docs-guard, e2e]
    timeout-minutes: 5
    steps:
      - name: Summarize what ran
        run: |
          {
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Detect changes | ${{ needs.changes.result }} |"
            echo "| Docs guard | ${{ needs.docs-guard.result }} |"
            echo "| Backend | ${{ needs.backend.result }} |"
            echo "| Frontend | ${{ needs.frontend.result }} |"
            echo "| E2E | ${{ needs.e2e.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail when something actually failed
        run: |
          results="${{ needs.changes.result }} ${{ needs.docs-guard.result }} ${{ needs.backend.result }} ${{ needs.frontend.result }} ${{ needs.e2e.result }}"
          echo "Results: $results"
          for result in $results; do
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error title=CI gate failed::A job finished as '$result'. See the summary table above."
              exit 1
            fi
          done
          echo "CI gate: OK (skipped jobs are documented in the summary table)."
