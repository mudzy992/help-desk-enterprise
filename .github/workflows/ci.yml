name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      # Triage (2026-10-05): a red run of 70 specs takes ~35 min; these make the
      # first look cheaper. `max_failures` stops the run after N failures, and
      # `retries: 0` does not retry them. Defaults keep the full, strict run.
      max_failures:
        description: "E2E only: stop after this many failed tests (0 = run all)"
        required: false
        default: "0"
      retries:
        description: "E2E only: retries per failing test (0 = no retry)"
        required: false
        default: "1"
      specs:
        description: "E2E only: comma-separated spec numbers, e.g. 10,18,22 (empty = all 36 files)"
        required: false
        default: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend build + test
    runs-on: ubuntu-latest
    env:
      # Prisma 7 resolves `env("DATABASE_URL")` while loading its config, so
      # `prisma generate` dies on a bare runner. Generation never connects, so a
      # syntactically valid placeholder is enough — no live Postgres in this job.
      DATABASE_URL: postgresql://servicedesk:servicedesk@127.0.0.1:5432/servicedesk
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm run lint
      - run: npm test -- --ci --coverage=false

  frontend:
    name: Frontend build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          # Puna istorija: `updatedAt` u manifestu ogledala dolazi iz
          # `git log -1 -- <fajl>` (scripts/generate-docs-content.mjs).
          # U plitkom klonu (zadano) datum je datum vršnog commita za svaki
          # fajl, pa bi provjera sinhronizacije padala bez stvarnog razloga.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check tracked files are client-neutral (Paket 4.1 §9, 4.1a §6)
        run: node ../scripts/check-client-neutral.mjs
      - name: Test the client-neutral guard itself (Paket 4.1a §6.4)
        run: node --test ../scripts/check-client-neutral.test.mjs
      - name: Check .env.example is authoritative (Paket 4.1 §7a)
        run: node ../scripts/check-env-example.mjs
      - name: Check screens for raw identifiers or raw grouping keys
        run: node ../scripts/check-ticket-id-leaks.mjs
      - name: Test the raw-identifier guard itself
        run: node --test ../scripts/check-ticket-id-leaks.test.mjs
      - name: Check the Pulse design system (tokens, colours, radius, i18n)
        run: node ../scripts/check-pulse-design-system.mjs
      - name: Check theme contrast (WCAG AA — konstitucija §22.1 i §22.3)
        run: node ../scripts/check-theme-contrast.mjs
      - name: Check static accessibility rules (Paket 2.8 §5.2)
        run: node ../scripts/check-a11y-static.mjs
      - name: Check no hook runs after an early return (React #310)
        run: node ../scripts/check-hooks-order.mjs
      - name: Test the hooks-order guard itself
        run: node --test ../scripts/check-hooks-order.test.mjs
      - name: Check docs content and mirror sync (Faza 3, DOCS_MODULE.md §9)
        run: node ../scripts/check-docs-content.mjs
      # Faza 3 (dopuna) — provjera „Šta je novo“/ruta ima i svoj test.
      - name: Test the docs-content guard itself
        run: node --test ../scripts/check-docs-content.test.mjs
      - name: Check the ticket-list page size against the API maximum (val 1)
        run: node ../scripts/check-ticket-list-page-size.mjs
      - name: Check workflow YAML for unquoted colons
        run: node ../scripts/check-workflows-yaml.mjs
      - name: Test the workflow-YAML guard itself
        run: node --test ../scripts/check-workflows-yaml.test.mjs
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E critical flows
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [backend, frontend]
    env:
      # Optional: with these four/five secrets set, the runner opens an SSH
      # tunnel to the database instead of requiring a public Postgres port.
      # See e2e/README.md ("Kada je E2E_DATABASE_URL dovoljan").
      E2E_SSH_PRIVATE_KEY: ${{ secrets.E2E_SSH_PRIVATE_KEY }}
      E2E_SSH_HOST: ${{ secrets.E2E_SSH_HOST }}
      E2E_SSH_PORT: ${{ secrets.E2E_SSH_PORT }}
      E2E_SSH_USER: ${{ secrets.E2E_SSH_USER }}
      E2E_SSH_DB_PORT: ${{ secrets.E2E_SSH_DB_PORT }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - name: Typecheck E2E specs and helpers
        run: npx tsc --noEmit -p tsconfig.json
      # Fails before Playwright starts, with a readable reason. Never prints a
      # value: only "set" / "empty" per name, resolved hosts and the health code.
      - name: Preflight — variables, secrets and stack reachability
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_API_URL: ${{ vars.E2E_API_URL }}
          E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
          E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_AGENT_EMAIL: ${{ secrets.E2E_AGENT_EMAIL }}
          E2E_AGENT_PASSWORD: ${{ secrets.E2E_AGENT_PASSWORD }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || secrets.DATABASE_URL }}
          E2E_INSTALL_TOKEN: ${{ secrets.E2E_INSTALL_TOKEN }}
        run: |
          set -u
          for name in E2E_BASE_URL E2E_API_URL E2E_SUPERADMIN_EMAIL E2E_SUPERADMIN_PASSWORD \
            E2E_USER_EMAIL E2E_USER_PASSWORD E2E_AGENT_EMAIL E2E_AGENT_PASSWORD DATABASE_URL E2E_INSTALL_TOKEN; do
            if [ -n "${!name:-}" ]; then echo "$name: set"; else echo "$name: empty"; fi
          done

          if [ -z "${E2E_API_URL:-}" ]; then
            echo "::error title=E2E did not run::E2E_API_URL is empty. Use a REPOSITORY variable (Settings -> Secrets and variables -> Actions -> Variables tab). A variable created under Settings -> Environments is only visible to a job that declares that environment, and this job does not."
            exit 1
          fi

          api_host=$(node -e "process.stdout.write(new URL(process.argv[1]).hostname)" "$E2E_API_URL")
          echo "API host: $api_host -> $(getent hosts "$api_host" | head -1 || echo 'NOT RESOLVABLE from this runner')"
          if [ -n "${DATABASE_URL:-}" ]; then
            db_host=$(node -e "process.stdout.write(new URL(process.argv[1]).hostname)" "$DATABASE_URL" 2>/dev/null || echo '?')
            echo "Database host: $db_host -> $(getent hosts "$db_host" | head -1 || echo 'NOT RESOLVABLE from this runner (internal Coolify/Docker names do not work here)')"
          fi

          health_code=$(curl -sS -o /tmp/e2e-health.json -w '%{http_code}' -m 20 "$E2E_API_URL/health" || echo 000)
          echo "GET $E2E_API_URL/health -> $health_code $(head -c 200 /tmp/e2e-health.json 2>/dev/null)"
          if [ "$health_code" != "200" ]; then
            echo "::error title=E2E stack unreachable::The API did not answer /health with 200 from a GitHub runner. Check the public DNS, the reverse proxy and any IP allow-listing between the runner and $E2E_API_URL."
            exit 1
          fi
      # Optional, only when E2E_SSH_* secrets exist: no public Postgres port is
      # then needed. Point E2E_DATABASE_URL at 127.0.0.1:15432.
      - name: Open an SSH tunnel to the database (optional)
        if: ${{ env.E2E_SSH_PRIVATE_KEY != '' && env.E2E_SSH_HOST != '' }}
        env:
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$E2E_SSH_PRIVATE_KEY" > ~/.ssh/e2e-db
          chmod 600 ~/.ssh/e2e-db
          ssh -o StrictHostKeyChecking=accept-new -o ExitOnForwardFailure=yes -f -N \
            -i ~/.ssh/e2e-db -p "${E2E_SSH_PORT:-22}" \
            -L "15432:127.0.0.1:${E2E_SSH_DB_PORT:-5432}" \
            "${E2E_SSH_USER:-root}@${E2E_SSH_HOST}"
          echo "SSH tunnel is up: 127.0.0.1:15432 -> ${E2E_SSH_HOST}:${E2E_SSH_DB_PORT:-5432}."
          if [ -n "${DATABASE_URL:-}" ]; then
            db_host=$(node -e "process.stdout.write(new URL(process.argv[1]).hostname)" "$DATABASE_URL" 2>/dev/null || echo '?')
            if [ "$db_host" != "127.0.0.1" ] && [ "$db_host" != "localhost" ]; then
              echo "::warning title=E2E tunnel unused::E2E_DATABASE_URL still points at \"$db_host\". While the tunnel is open it must point at 127.0.0.1:15432, otherwise the tunnel is bypassed and the MFA reset fails on the internal host."
            else
              echo "E2E_DATABASE_URL points at the tunnel (127.0.0.1:15432)."
            fi
          fi
      - run: npx playwright install --with-deps chromium
      - name: Run E2E (requires live stack secrets)
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
          E2E_API_URL: ${{ vars.E2E_API_URL }}
          E2E_SUPERADMIN_EMAIL: ${{ secrets.E2E_SUPERADMIN_EMAIL }}
          E2E_SUPERADMIN_PASSWORD: ${{ secrets.E2E_SUPERADMIN_PASSWORD }}
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          E2E_AGENT_EMAIL: ${{ secrets.E2E_AGENT_EMAIL }}
          E2E_AGENT_PASSWORD: ${{ secrets.E2E_AGENT_PASSWORD }}
          DATABASE_URL: ${{ secrets.E2E_DATABASE_URL || secrets.DATABASE_URL }}
          E2E_SUPERADMIN_TOTP_SECRET: ${{ secrets.E2E_SUPERADMIN_TOTP_SECRET }}
          E2E_INSTALL_TOKEN: ${{ secrets.E2E_INSTALL_TOKEN }}
          E2E_RETRIES: ${{ inputs.retries || '1' }}
          E2E_SPECS: ${{ inputs.specs }}
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: |
          # Triage (2026-10-05): a full run is 70 tests / ~35 min, so a red run can
          # be narrowed to the files that failed, e.g. specs=10,18,22. Numbers map
          # to `e2e/tests/<number>-*.spec.ts`; an unknown number fails loudly
          # instead of silently running everything.
          files=()
          if [ -n "${E2E_SPECS:-}" ]; then
            IFS=',' read -ra parts <<< "$E2E_SPECS"
            for part in "${parts[@]}"; do
              number="$(echo "$part" | tr -d '[:space:]')"
              [ -z "$number" ] && continue
              matches=(tests/"$number"-*.spec.ts)
              if [ ! -e "${matches[0]}" ]; then
                echo "::error title=Unknown spec::No tests/$number-*.spec.ts in e2e/ — check the dispatch input."
                exit 1
              fi
              files+=("${matches[@]}")
            done
            echo "Triage mode: running ${#files[@]} spec file(s): ${files[*]}"
          fi

          max_failures="${{ inputs.max_failures || '0' }}"
          args=(--reporter=list,json)
          if [ "$max_failures" != "0" ] && [ -n "$max_failures" ]; then
            echo "Triage mode: stopping after $max_failures failed test(s), retries=$E2E_RETRIES."
            args+=(--max-failures="$max_failures")
          fi
          npx playwright test "${args[@]}" "${files[@]}"
      # Always, so a red run leaves a readable trace in the log and as an artifact.
      - name: Summarize failures (JSON report)
        if: ${{ always() }}
        run: node scripts/summarize-playwright-json.mjs results.json
      - name: Upload the Playwright report and traces
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/results.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Test the JSON summarizer itself
        if: ${{ always() }}
        run: node --test scripts/summarize-playwright-json.test.mjs
