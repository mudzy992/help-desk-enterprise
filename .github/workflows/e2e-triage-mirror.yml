# Triage mirror (2026-10-10): when the sandbox cannot reach GitHub's artifact
# blob storage, this workflow downloads the `playwright-report` artifact of a
# finished E2E run runner-side, extracts the failed/flaky tests and publishes
# them as a check-run `output.summary` on the tested SHA — readable through the
# REST API without touching blob storage.
name: E2E triage mirror
on:
  # The analysis sandbox has no actions:write (cannot dispatch) and no access
  # to artifact blob storage, so this workflow also self-runs on a cron and
  # mirrors any not-yet-mirrored finished E2E run. It exits early when there
  # is nothing new; the cron is removed once triage mirroring is retired.
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches:
      - arena/04d0979c-help-desk-enterprise
    paths:
      - '.github/workflows/e2e-triage-mirror.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run id whose playwright-report artifact should be mirrored (empty = auto-discover)'
        required: false
      artifact:
        description: 'Artifact name'
        default: 'playwright-report'
permissions:
  actions: read
  checks: write
jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Pick the run to mirror (auto-discovery on cron)
        if: ${{ inputs.run_id == '' || inputs.run_id == null }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Full runs live on schedule / dispatch, and a push to master also
          # launches the whole suite. Dedup per run id via the check-run name,
          # so each run is mirrored at most once.
          CANDIDATES=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?status=completed&per_page=15" \
            --jq '.workflow_runs[] | select(.event=="schedule" or .event=="workflow_dispatch" or .event=="push") | (.id|tostring) + ":" + .head_sha[:7]' \
            | head -n 8)
          echo "candidates=$(echo "$CANDIDATES" | tr '\n' ',')" >> "$GITHUB_ENV"
          RUN_ID=""
          while IFS=: read -r id sha; do
            [ -n "$id" ] || continue
            EXISTING=$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" \
              --jq "[.check_runs[] | select(.name | startswith(\"E2E triage mirror v2 (run $id\"))] | length")
            [ "$EXISTING" != "0" ] && continue
            # Push runs skip the E2E job entirely — no report artifact. Mark
            # them so the dedup skips them next time, then try the next one.
            ARTIFACTS=$(gh api "repos/${{ github.repository }}/actions/runs/$id/artifacts" \
              --jq '[.artifacts[] | select(.name=="playwright-report")] | length')
            if [ "$ARTIFACTS" = "0" ]; then
              SUMMARY=$(jq -Rs . <<< "Run $id has no playwright-report artifact (E2E did not run) — nothing to mirror.")
              gh api "repos/${{ github.repository }}/check-runs" \
                --method POST \
                -f name="E2E triage mirror v2 (run $id: no artifact)" \
                -f head_sha="$(gh api "repos/${{ github.repository }}/commits/$sha" --jq .sha)" \
                -F status=completed \
                -f conclusion=neutral \
                -f "output[title]=E2E triage mirror: run $id had no report" \
                -f "output[summary]=$SUMMARY" \
                --jq '.id' > /dev/null
              continue
            fi
            RUN_ID="$id"
            break
          done <<< "$CANDIDATES"
          echo "run_id=$RUN_ID" >> "$GITHUB_ENV"
      - name: Download the Playwright report of the target run
        if: ${{ env.run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ env.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ inputs.artifact || 'playwright-report' }}" \
            --dir report
          ls -la report
      - name: Publish failed/flaky tests as a check-run summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -z "${{ env.run_id }}" ]; then
            SUMMARY=$(jq -Rs . <<< "No un-mirrored full CI run found. Candidates checked: ${{ env.candidates }}")
            gh api "repos/${{ github.repository }}/check-runs" \
              --method POST \
              -f name='E2E triage mirror v2' \
              -f head_sha="${{ github.sha }}" \
              -F status=completed \
              -f conclusion=neutral \
              -f "output[title]=E2E triage mirror v2: nothing to do" \
              -f "output[summary]=$SUMMARY" \
              --jq '.id'
            exit 0
          fi
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/actions/runs/${{ env.run_id }}" --jq .head_sha)
          node - <<'NODE' > triage.md
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('report/results.json', 'utf8'));
          const walk = (suite, path, out) => {
            const here = [...path, suite.title].filter(Boolean).join(' / ');
            for (const child of suite.suites ?? []) walk(child, [...path, suite.title].filter(Boolean), out);
            for (const spec of suite.specs ?? []) {
              for (const test of spec.tests ?? []) {
                const last = test.results?.[test.results.length - 1];
                out.push({
                  file: suite.file ?? '',
                  path: here,
                  title: spec.title,
                  ok: spec.ok,
                  status: test.status,
                  expected: test.expectedStatus,
                  attempts: test.results?.length ?? 0,
                  line: test.location?.line ?? '?',
                  error: last?.error?.message ?? '',
                  stack: (last?.error?.stack ?? '').split('\n').slice(0, 6).join('\n'),
                  attachments: (last?.attachments ?? []).map((a) => a.name).join(','),
                });
              }
            }
          };
          const out = [];
          for (const s of r.suites ?? []) walk(s, [], out);
          const files = [...new Set(out.map((t) => t.file).filter(Boolean))];
          const bad = out.filter((t) => !t.ok && t.status !== 'skipped');
          const skipped = out.filter((t) => t.status === 'skipped');
          const lines = ['## E2E triage mirror v2', '',
            `Files in this report (${files.length}): ${files.join(', ')}`, '',
            `Stats: ${out.filter((t) => t.status === 'passed').length} passed, ` +
            `${out.filter((t) => t.status === 'unexpected').length} unexpected, ` +
            `${out.filter((t) => t.status === 'flaky').length} flaky, ` +
            `${out.filter((t) => t.status === 'skipped').length} skipped, ` +
            `${out.filter((t) => ['interrupted','didnotrun'].includes(t.status)).length} not-run.`];
          for (const t of bad) {
            lines.push('', `### ${t.file}:${t.line} — ${t.title}`,
              `- status: ${t.status} after ${t.attempts} attempt(s)`);
            if (t.error) lines.push('```', ...t.error.split('\n').slice(0, 30), '```');
            else if (t.stack) lines.push('```', ...t.stack.split('\n'), '```');
          }
          for (const t of skipped) {
            lines.push('', `- skipped: ${t.file}:${t.line} — ${t.title}`);
          }
          if (bad.length === 0) lines.push('', 'No failing tests in the artifact.');
          console.log(lines.join('\n'));
          NODE
          wc -c triage.md
          SUMMARY=$(jq -Rs . < triage.md)
          gh api "repos/${{ github.repository }}/check-runs" \
            --method POST \
            -f name='E2E triage mirror' \
            -f head_sha="$HEAD_SHA" \
            -F status=completed \
            -f conclusion=neutral \
            -f "output[title]=E2E triage mirror v2 of run ${{ env.run_id }}" \
            -f "output[summary]=$SUMMARY" \
            --jq '.id'
