services:
  frontend:
    build: ./frontend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${TRAEFIK_STACK}-frontend.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.${TRAEFIK_STACK}-frontend.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.${TRAEFIK_STACK}-frontend.tls=${TRAEFIK_TLS}"
      - "traefik.http.services.${TRAEFIK_STACK}-frontend.loadbalancer.server.port=10000"
    env_file:
      - ./frontend/.env
    restart: unless-stopped
    networks:
      - ${TRAEFIK_NETWORK}

  backend:
    build: ./backend
    environment:
      - PORT=10001
    env_file:
      - ./backend/.env
    volumes:
      - ${UPLOADS_HOST_DIR}:/usr/app/uploads
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${TRAEFIK_STACK}-backend.rule=Host(`${TRAEFIK_HOST}`) && PathPrefix(`${BACKEND_PATH_PREFIX}`)"
      - "traefik.http.routers.${TRAEFIK_STACK}-backend.entrypoints=${TRAEFIK_ENTRYPOINT}"
      - "traefik.http.routers.${TRAEFIK_STACK}-backend.tls=${TRAEFIK_TLS}"
      - "traefik.http.routers.${TRAEFIK_STACK}-backend.middlewares=${TRAEFIK_STACK}-stripprefix"
      - "traefik.http.middlewares.${TRAEFIK_STACK}-stripprefix.stripprefix.prefixes=${BACKEND_PATH_PREFIX}"
      - "traefik.http.services.${TRAEFIK_STACK}-backend.loadbalancer.server.port=10001"
    restart: unless-stopped
    networks:
      - ${TRAEFIK_NETWORK}

networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}

