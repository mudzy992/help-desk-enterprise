# Coolify: bez Traefik labela, bez /backend prefixa.
# FQDN i TLS postavlja Coolify. Env dolazi iz Coolify UI (.env.example).
# Postgres NIJE ovdje — Coolify Database → DATABASE_URL.
# Redis: external mreža redis-net, host redis-core.

services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    expose:
      - "10000"

  backend:
    build: ./backend
    command: sh -c "npx prisma migrate deploy && node dist/src/main.js"
    restart: unless-stopped
    expose:
      - "10001"
    volumes:
      - uploads:/usr/app/uploads
    networks:
      - default
      - redis-net

  worker:
    build: ./backend
    command: node dist/src/worker.js
    restart: unless-stopped
    volumes:
      - uploads:/usr/app/uploads
    networks:
      - default
      - redis-net

volumes:
  uploads:

networks:
  redis-net:
    external: true
    name: redis-net
