# Coolify: bez Traefik labela, bez /backend prefixa.
# FQDN i TLS postavlja Coolify. Env dolazi iz Coolify UI (.env.example).
# Postgres NIJE ovdje — Coolify Database → DATABASE_URL.
# Redis: external mreža redis_net, host redis-core.
# REDIS_USERNAME + REDIS_PASSWORD moraju biti isti na backend i worker,
# i jednaki ACL useru ephelpdesk iz ops/redis-acl.line (placeholder change-me).

# Postgres je eksterni servis (Coolify Database). Ovaj anchor prosljeđuje pool i
# timeout-e (plan §1.4) u oba procesa; worker dobija duži statement_timeout jer
# njegovi poslovi (SLA sken, retencija) legitimno traju duže od HTTP zahtjeva.
x-database-environment: &database-environment
  DATABASE_URL: ${DATABASE_URL}
  DB_POOL_MAX: ${DB_POOL_MAX:-40}
  DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:-30000}
  DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:-3000}
  DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-5000}

x-redis-environment: &redis-environment
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_USERNAME: ${REDIS_USERNAME:-ephelpdesk}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-ephelpdesk}
  QUEUE_PREFIX: ${QUEUE_PREFIX:-bull:ephelpdesk}

# Paket 1.5: linkovi u e-mailovima. Oba procesa renderuju e-mailove (worker za
# SLA događaje), pa oba moraju znati javni URL frontenda.
x-app-environment: &app-environment
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
  # Paket 1.8: PEM vlastitog CA za LDAPS (prazno = sistemsko povjerenje).
  # Fajl se montira u backend i worker (Coolify: Storages → File mount).
  AD_LDAPS_CA_CERT_PATH: ${AD_LDAPS_CA_CERT_PATH:-}
  AD_LDAPS_CA_CERT_BASE64: ${AD_LDAPS_CA_CERT_BASE64:-}
  # Paket 2.1: AES-256 ključ za TOTP tajne (base64, 32 bajta: `openssl rand -base64 32`).
  # Bez njega MFA se ne može uključiti; promjena ključa poništava sve postavljene MFA.
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}

# Faza 3.1: WebSocket sloj koristi Socket.IO Redis adapter, pa LB ispred servisa
# MORA imati sticky sesije (cookie), inače handshake padne pri prelasku s pollinga
# na WebSocket. Rolling deploy: vidi ops/ws-rolling-deploy.md (drain ≤ 30 s).
services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    restart: unless-stopped
    expose:
      - "10000"

  backend:
    build: ./backend
    command: sh -c "npx prisma migrate deploy && node dist/src/main.js"
    restart: unless-stopped
    expose:
      - "10001"
    environment:
      <<: [*database-environment, *redis-environment, *app-environment]
    volumes:
      - uploads:/usr/app/uploads
    networks:
      - default
      - redis_net
      - db_net

  worker:
    build: ./backend
    command: node dist/src/worker.js
    restart: unless-stopped
    environment:
      <<: [*database-environment, *redis-environment, *app-environment]
      # Worker: manje konekcija (jedan proces), duži statement budžet.
      DATABASE_POOL_ROLE: worker
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-10}
      DB_STATEMENT_TIMEOUT_MS: ${WORKER_DB_STATEMENT_TIMEOUT_MS:-30000}
    volumes:
      - uploads:/usr/app/uploads
    networks:
      - default
      - redis_net
      - db_net

  # Antivirus za priloge (review N5). Backend ga nalazi kao `clamav:3310` na
  # default mreži ovog compose projekta — postaviti CLAMAV_HOST=clamav na backendu.
  # Prvi start skida bazu potpisa (~300 MB, 3–10 min); treba ~1,5–2 GB RAM-a.
  # Port se NE izlaže van (samo interna mreža).
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    expose:
      - "3310"
    volumes:
      - clamav-db:/var/lib/clamav
    mem_limit: 2g
    networks:
      - default

volumes:
  uploads:
  clamav-db:

networks:
  db_net:
    external: true
    name: db_net
  redis_net:
    external: true
    name: redis_net
