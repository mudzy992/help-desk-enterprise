# Paket 2.3 — lokalni IMAP/SMTP server za test odgovora e-mailom.
# Uputstvo: docs/ops/inbound-email.md §5
#
#   docker compose up -d
#   ./send-reply.sh T-000123 ana.anic@example.com "Printer radi, hvala."
#
# Dostupan backendu i workeru kao greenmail.test:3143 (IMAP) i :3025 (SMTP)
# preko mreže db_net. Portovi se NE objavljuju na hostu. GreenMail prihvata
# svaku poruku i čuva je samo u memoriji (restart = prazan sandučić).
services:
  greenmail:
    image: greenmail/standalone:2.1.2
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.smtp
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=helpdesk:helpdesk-test@example.com
        -Dgreenmail.users.login=email
        -Dgreenmail.verbose
    networks:
      db_net:
        aliases: [greenmail.test]
    restart: unless-stopped

  # Pomoćni kontejner za slanje testnih poruka (curl SMTP).
  mailer:
    image: curlimages/curl:8.10.1
    entrypoint: ["sleep", "infinity"]
    volumes:
      - ./messages:/messages:ro
    networks: [db_net]
    restart: unless-stopped

networks:
  db_net:
    external: true
