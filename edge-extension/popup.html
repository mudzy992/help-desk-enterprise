<!doctype html>
<html lang="bs">
  <head>
    <meta charset="utf-8" />
    <title>EP-HelpDesk</title>
    <link rel="stylesheet" href="/src/popup.css" />
  </head>
  <body>
    <main>
      <h1>EP-HelpDesk</h1>
      <p id="status">Nije prijavljen.</p>
      <form id="login-form">
        <label>
          API URL
          <input id="api-base-url" type="url" required placeholder="http://localhost:10001" />
        </label>
        <label>
          Email
          <input id="email" type="email" required autocomplete="username" />
        </label>
        <label>
          Lozinka
          <input id="password" type="password" required autocomplete="current-password" />
        </label>
        <button type="submit">Prijava</button>
      </form>
      <p id="error" hidden></p>
      <section id="workspace" hidden>
        <h2>Otvoreni tiketi</h2>
        <ul id="inbox"></ul>
        <p id="inbox-empty" hidden>Nema otvorenih tiketa.</p>
        <div id="thread" hidden>
          <h2 id="thread-title"></h2>
          <ol id="messages"></ol>
          <form id="reply-form">
            <label>
              Quick reply
              <textarea id="reply-body" rows="3" required></textarea>
            </label>
            <button type="submit">Pošalji</button>
          </form>
          <button id="open-desk-ticket" type="button">Open in Desk</button>
          <button id="open-quick-assist" type="button" hidden>Open Quick Assist</button>
        </div>
        <button id="open-desk" type="button">Open in Desk</button>
        <button id="sign-out" type="button">Odjava</button>
      </section>
    </main>
    <script type="module" src="/src/popup.ts"></script>
  </body>
</html>
