server {
  listen 10000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Hashed build output: the name changes with the content, so it can be
  # cached for a year. A missing file must be a real 404 - falling back to
  # index.html would hand HTML to a JS import after a redeploy.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # index.html names the current chunks: always revalidate, so a redeploy is
  # picked up on the next navigation instead of after a manual refresh.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
