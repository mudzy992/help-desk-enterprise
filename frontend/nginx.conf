server {
  listen 10000;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Behind Coolify/Traefik the container port (10000) and plain http are
  # internal details: never put them into a Location header. Relative
  # redirects keep the public scheme, host and port.
  absolute_redirect off;
  port_in_redirect off;

  # Hashed build output (Vite `build.assetsDir = "static"`): the name changes
  # with the content, so it can be cached for a year. A missing file must be a
  # real 404 - falling back to index.html would hand HTML to a JS import after a
  # redeploy. The directory is deliberately not called /assets/, because that is
  # an application route (CMDB) and must reach the SPA fallback.
  location /static/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # index.html names the current chunks: always revalidate, so a redeploy is
  # picked up on the next navigation instead of after a manual refresh.
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # SPA fallback. No `$uri/`: a client route that matches a directory in the
  # build output must still get index.html, not a 301 to "<route>/".
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
