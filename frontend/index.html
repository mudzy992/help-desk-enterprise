<!doctype html>
<html lang="bs" data-theme="pulse" data-accent="indigo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F5F6F8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D0E12" />
    <title>Service Desk</title>
    <!--
      Applies the stored appearance before the first paint. Keep the keys in
      sync with `src/lib/theme/theme-storage.ts`; if this script fails the
      application falls back to the legacy dark theme, which is what the CSS
      `:root` defaults describe.
    -->
    <script>
      (function () {
        // Paket 4.1: one-off move of the legacy storage keys (mirrors
        // src/lib/storage/legacy-storage-keys.ts); runs before anything reads them.
        try {
          var legacy = [
            ["ep-helpdesk.theme.design", "service-desk.theme.design"],
            ["ep-helpdesk.theme.mode", "service-desk.theme.mode"],
            ["ep-helpdesk.theme.accent", "service-desk.theme.accent"],
            ["ep-helpdesk.session", "service-desk.session"],
            ["ep-helpdesk.timeActivityAt", "service-desk.timeActivityAt"],
            ["ephelpdesk.locale", "service-desk.locale"]
          ];
          for (var i = 0; i < legacy.length; i++) {
            var value = window.localStorage.getItem(legacy[i][0]);
            if (value === null) continue;
            if (window.localStorage.getItem(legacy[i][1]) === null) window.localStorage.setItem(legacy[i][1], value);
            window.localStorage.removeItem(legacy[i][0]);
          }
        } catch (error) {}
      })();
      (function () {
        try {
          var design = window.localStorage.getItem("service-desk.theme.design");
          if (design !== "classic" && design !== "pulse") {
            design = "pulse";
          }
          var mode = window.localStorage.getItem("service-desk.theme.mode");
          if (mode !== "light" && mode !== "dark" && mode !== "system") {
            mode = "system";
          }
          var accent = window.localStorage.getItem("service-desk.theme.accent");
          if (
            accent !== "indigo" &&
            accent !== "teal" &&
            accent !== "rose" &&
            accent !== "cyan" &&
            accent !== "amber" &&
            accent !== "orange"
          ) {
            accent = "indigo";
          }
          var prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var isDark =
            design === "classic" || mode === "dark" || (mode === "system" && prefersDark);
          document.documentElement.setAttribute("data-theme", design);
          document.documentElement.setAttribute("data-accent", accent);
          document.documentElement.classList.toggle("dark", isDark);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "classic");
          document.documentElement.setAttribute("data-accent", "indigo");
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
